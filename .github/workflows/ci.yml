name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: >-
          fraudstream --count 500 --seed 360 --output /tmp/scored.jsonl
          --metrics-output /tmp/evaluation.json --calibration-output /tmp/calibration.json
      - run: test "$(wc -l < /tmp/scored.jsonl)" -eq 500
      - run: python -c 'import json; assert json.load(open("/tmp/evaluation.json"))["events"] == 500'
      - run: >-
          python -c 'import json; report=json.load(open("/tmp/calibration.json"));
          assert report["selected"]["alert_rate"] <= report["max_alert_rate"]'
      - name: Smoke test scoring API
        run: |
          uvicorn fraudstream.api:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(20):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health/ready") as response:
                      payload = json.load(response)
                  assert payload["status"] == "ready"
                  break
              except OSError:
                  if attempt == 19:
                      raise
                  time.sleep(0.25)

          request = urllib.request.Request(
              "http://127.0.0.1:8000/v1/transactions/score",
              data=json.dumps({
                  "transaction_id": "ci_alert_1",
                  "account_id": "ci_account_1",
                  "merchant_id": "merchant_risky_ci",
                  "occurred_at": "2026-09-21T13:00:00Z",
                  "amount": 1500,
                  "currency": "USD",
                  "channel": "ecommerce",
                  "latitude": 30.2672,
                  "longitude": -97.7431,
                  "device_id": "ci_device_1"
              }).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              decision = json.load(response)
          assert decision["case_id"] == "case_ci_alert_1"
          with urllib.request.urlopen("http://127.0.0.1:8000/v1/cases") as response:
              cases = json.load(response)
          assert len(cases) == 1 and cases[0]["status"] == "new"
          PY
          python scripts/load_test.py --requests 100 --concurrency 10 > /tmp/load-report.json
          python -c 'import json; report=json.load(open("/tmp/load-report.json")); assert report["requests"] == 100 and report["latency_ms"]["p95"] > 0'
      - name: Build scoring API image
        run: docker build --file Dockerfile.api --tag fraudstream-api:test .
      - name: Build investigator dashboard image
        run: docker build --file Dockerfile.dashboard --tag fraudstream-dashboard:test .

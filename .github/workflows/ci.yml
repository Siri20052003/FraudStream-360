name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: >-
          fraudstream --count 500 --seed 360 --output /tmp/scored.jsonl
          --metrics-output /tmp/evaluation.json --calibration-output /tmp/calibration.json
      - run: test "$(wc -l < /tmp/scored.jsonl)" -eq 500
      - run: python -c 'import json; assert json.load(open("/tmp/evaluation.json"))["events"] == 500'
      - run: >-
          python -c 'import json; report=json.load(open("/tmp/calibration.json"));
          assert report["selected"]["alert_rate"] <= report["max_alert_rate"]'
      - name: Smoke test scoring API
        run: |
          uvicorn fraudstream.api:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(20):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health/ready") as response:
                      payload = json.load(response)
                  assert payload["status"] == "ready"
                  break
              except OSError:
                  if attempt == 19:
                      raise
                  time.sleep(0.25)
          PY
      - name: Build scoring API image
        run: docker build --file Dockerfile.api --tag fraudstream-api:test .
      - name: Build investigator dashboard image
        run: docker build --file Dockerfile.dashboard --tag fraudstream-dashboard:test .

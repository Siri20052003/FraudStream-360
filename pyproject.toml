[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fraudstream-360"
version = "0.1.0"
description = "Real-time payment fraud simulation and explainable risk scoring"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Siri Chandana Ponnamaneni"}]

[project.scripts]
fraudstream = "fraudstream.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/fraudstream"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"


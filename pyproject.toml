[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fraudstream-360"
version = "0.1.0"
description = "Real-time payment fraud simulation and explainable risk scoring"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Siri Chandana Ponnamaneni"}]

[project.scripts]
fraudstream = "fraudstream.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pytest>=8.0", "ruff>=0.6", "uvicorn>=0.30,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/fraudstream"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
